services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmaker-api
    container_name: taskmaker-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - taskmaker-data:/app/data
    restart: unless-stopped

volumes:
  taskmaker-data:
